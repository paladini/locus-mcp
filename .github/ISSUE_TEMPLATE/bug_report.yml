name: Bug report
description: Report a bug or unexpected behavior in Locus
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for us to reproduce the issue.

  - type: input
    id: version
    attributes:
      label: Locus version
      placeholder: "0.1.1 or git commit"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node -v output"
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: MCP host
      options:
        - Cursor
        - Claude Code
        - VS Code
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `locus check`
        2. Call MCP tool `locate` with ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Output of `locus check`, MCP tool response, or `LOCUS_DEBUG=1` logs
      render: shell
