name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack MCPB bundle
        run: npm run pack:mcpb

      - name: Publish @paladini/locus-core to npm
        run: npm publish -w @paladini/locus-core --provenance --access public

      - name: Publish @paladini/locus-mcp to npm
        run: npm publish -w @paladini/locus-mcp --provenance --access public

      - name: Publish to GitHub Packages
        run: |
          npm publish -w @paladini/locus-core --registry https://npm.pkg.github.com
          npm publish -w @paladini/locus-mcp --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: locus-mcp.mcpb
          generate_release_notes: true
